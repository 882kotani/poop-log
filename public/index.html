<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>うんちログ</title>
  <meta name="description" content="1歳の娘の排便状況をスマートフォンから簡単に記録・確認できる育児記録WEBアプリ">
  <meta name="theme-color" content="#FFF9F3">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22[http://www.w3.org/2000/svg%22](http://www.w3.org/2000/svg%22) viewBox=%220 0 32 32%22><path fill=%22%23E8A17D%22 d=%22M16 3c-1.5 0-2.8 1.2-2.5 2.7.3 1.3-.2 2.6-1.3 3.3C9.8 10.5 8 13 8 16c0 1.2.3 2.3.8 3.3-1.6.7-2.8 2.3-2.8 4.2 0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5 0-1.9-1.2-3.5-2.8-4.2.5-1 .8-2.1.8-3.3 0-3-1.8-5.5-4.2-7-1.1-.7-1.6-2-1.3-3.3.3-1.5-1-2.7-2.5-2.7z%22/><circle cx=%2213%22 cy=%2217%22 r=%221.5%22 fill=%22%23FFFFFF%22/><circle cx=%2219%22 cy=%2217%22 r=%221.5%22 fill=%22%23FFFFFF%22/></svg>">
</head>
<body>
  <div class="app-container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="header-branding">
        <svg class="app-logo-icon" viewBox="0 0 32 32" fill="none" xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" aria-hidden="true">
          <path d="M16 4C14.8 4 13.8 4.9 14 6.1C14.2 7.3 13.7 8.5 12.7 9.2C10.5 10.7 9 13.2 9 16C9 17.1 9.3 18.2 9.8 19.1C8.2 19.8 7 21.4 7 23.3C7 26 9.2 28 12 28H20C22.8 28 25 26 25 23.3C25 21.4 23.8 19.8 22.2 19.1C22.7 18.2 23 17.1 23 16C23 13.2 21.5 10.7 19.3 9.2C18.3 8.5 17.8 7.3 18 6.1C18.2 4.9 17.2 4 16 4Z" fill="#E8A17D"/>
          <ellipse cx="13" cy="17" rx="1.5" ry="2" fill="#FFFFFF"/>
          <ellipse cx="19" cy="17" rx="1.5" ry="2" fill="#FFFFFF"/>
          <circle cx="13.3" cy="17" r="0.8" fill="#493B35"/>
          <circle cx="19.3" cy="17" r="0.8" fill="#493B35"/>
          <path d="M14.5 20.5C15 21.2 17 21.2 17.5 20.5" stroke="#A65F42" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <h1 class="header-title">うんちログ</h1>
      </div>
      <button id="infoBtn" class="info-btn" aria-label="アプリ情報を見る" title="アプリ情報">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </button>
    </header>

    <main class="main-content">
      <!-- 今日の排便状況サマリー & 日付選択 -->
      <section class="summary-section" aria-labelledby="summaryTitle">
        <div class="date-navigator">
          <button id="prevDateBtn" class="nav-arrow-btn" aria-label="前の日へ移動">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          
          <!-- label要素として配置し、タップで確実に日付ピッカーを起動 -->
          <label for="datePicker" class="date-display-trigger" title="タップしてカレンダーを開く">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="calendar-icon"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span id="currentDateDisplay" class="date-label">----年--月--日(-)</span>
            <input type="date" id="datePicker" class="native-date-input" aria-label="カレンダーで日付を選択">
          </label>

          <button id="nextDateBtn" class="nav-arrow-btn" aria-label="次の日へ移動">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>

        <div class="summary-card">
          <span id="summaryTitle" class="summary-badge">今日のうんち</span>
          <div class="count-hero">
            <span id="summaryCountNumber" class="count-value">0</span>
            <span class="count-unit">回</span>
          </div>
          <p id="summaryEmptyMsg" class="summary-hint">今日はまだ記録がありません</p>
        </div>
      </section>

      <!-- 排便記録メインボタン（ランドマーク） -->
      <section class="record-cta-section" aria-label="排便を記録する">
        <div class="record-button-aura"></div>
        <button id="mainRecordBtn" class="main-record-btn" aria-label="うんちした！を記録する">
          <div class="btn-inner">
            <svg class="record-mascot" viewBox="0 0 64 64" fill="none" xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" aria-hidden="true">
              <path d="M32 7C29.5 7 27.5 9 28 11.5C28.4 14 27.3 16.5 25.2 18C20.5 21.2 17.5 26.5 17.5 32.5C17.5 34.8 18.2 37 19.3 38.8C16 40.3 13.5 43.6 13.5 47.5C13.5 53 18 57.5 23.5 57.5H40.5C46 57.5 50.5 53 50.5 47.5C50.5 43.6 48 40.3 44.7 38.8C45.8 37 46.5 34.8 46.5 32.5C46.5 26.5 43.5 21.2 38.8 18C36.7 16.5 35.6 14 36 11.5C36.5 9 34.5 7 32 7Z" fill="#FFFFFF"/>
              <ellipse cx="26" cy="34" rx="3" ry="4" fill="#A65F42"/>
              <ellipse cx="38" cy="34" rx="3" ry="4" fill="#A65F42"/>
              <circle cx="27" cy="33.5" r="1.3" fill="#FFFFFF"/>
              <circle cx="39" cy="33.5" r="1.3" fill="#FFFFFF"/>
              <ellipse cx="20.5" cy="38" rx="2.5" ry="1.5" fill="#F8B89E"/>
              <ellipse cx="43.5" cy="38" rx="2.5" ry="1.5" fill="#F8B89E"/>
              <path d="M29 41.5C30.5 43.5 33.5 43.5 35 41.5" stroke="#A65F42" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <span class="btn-primary-text">うんちした！</span>
            <span class="btn-sub-text">タップで現在時刻を記録</span>
          </div>
        </button>

        <div id="toastFeedback" class="toast-feedback" role="status" aria-live="polite">記録しました！</div>
        <div id="errorBanner" class="error-banner" role="alert" aria-live="assertive"></div>
      </section>

      <!-- うんちの履歴（タイムテーブル形式） -->
      <section class="timeline-section" aria-labelledby="historyHeading">
        <div class="section-title-wrap">
          <h2 id="historyHeading" class="section-title">うんちの履歴</h2>
          <span class="section-sub-badge">0時〜23時</span>
        </div>

        <div id="historyTableContainer" class="timetable-card" aria-live="polite">
          <div class="skeleton-loader">読み込み中...</div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p class="footer-copy">うんちログ &bull; こどもの毎日のリズムをやさしくサポート</p>
    </footer>
  </div>

  <!-- 1. アプリ情報モーダル (README) -->
  <dialog id="readmeModal" class="app-dialog" aria-labelledby="readmeModalTitle">
    <div class="dialog-card readme-dialog-card">
      <div class="dialog-header">
        <h2 id="readmeModalTitle" class="dialog-title">アプリ情報</h2>
        <button id="closeReadmeBtn" class="dialog-close-btn" aria-label="閉じる">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div id="readmeBody" class="dialog-body markdown-body">
        <div class="skeleton-loader">ドキュメントを読み込んでいます...</div>
      </div>
      <div class="dialog-footer">
        <button id="closeReadmeBottomBtn" class="btn btn-secondary">閉じる</button>
      </div>
    </div>
  </dialog>

  <!-- 2. 編集モーダル -->
  <dialog id="editModal" class="app-dialog" aria-labelledby="editModalTitle">
    <div class="dialog-card">
      <div class="dialog-header">
        <h2 id="editModalTitle" class="dialog-title">記録の修正</h2>
        <button id="closeEditBtn" class="dialog-close-btn" aria-label="閉じる">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <form id="editForm" class="dialog-form">
        <input type="hidden" id="editRecordId">
        <div class="input-block">
          <label for="editTimeInput" class="input-label">排便した時刻</label>
          <input type="time" id="editTimeInput" class="styled-input" required>
        </div>
        <div class="input-block">
          <div class="label-with-count">
            <label for="editNoteInput" class="input-label">備考・メモ</label>
            <span class="count-indicator"><span id="charCount">0</span> / 500</span>
          </div>
          <textarea id="editNoteInput" class="styled-textarea" rows="3" maxlength="500" placeholder="例: 少しかため、いつもより多め、機嫌は良好 など"></textarea>
        </div>
        <div class="dialog-actions">
          <button type="button" id="cancelEditBtn" class="btn btn-secondary">キャンセル</button>
          <button type="submit" id="saveEditBtn" class="btn btn-primary">保存する</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- 3. 削除確認ダイアログ -->
  <dialog id="deleteModal" class="app-dialog" aria-labelledby="deleteModalTitle">
    <div class="dialog-card delete-card">
      <div class="delete-icon-wrap">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B84343" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
      </div>
      <h2 id="deleteModalTitle" class="delete-head-title">記録を削除しますか？</h2>
      <p id="deleteTargetTime" class="delete-target-badge">--:-- の記録</p>
      <p class="delete-sub-text">削除した記録は元に戻せません。<br>本当に削除してよろしいですか？</p>
      <div class="dialog-actions">
        <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">キャンセル</button>
        <button type="button" id="confirmDeleteBtn" class="btn btn-danger">削除する</button>
      </div>
    </div>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
